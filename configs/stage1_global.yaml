# Stage I, Global memory: suffix cross-entropy after Global reads (8 GPUs).
# The released Global was trained for 3 epochs on 8 GPUs, then for epochs 4-6 on 16 GPUs
# with a fresh optimizer (start_epoch: 3, init: <epoch-3 weights>); one state per GPU and step.
component: global
checkpoint: checkpoints/remap-stage0          # model whose decoder and other memories stay frozen
base_model: YuhengSSS/Q-Zoom-Qwen2.5VL-7B
train_data: data/stage1/global.manifest.jsonl  # written by remap.training.stage1.annotate
output: runs/stage1_global
epochs: 6
learning_rate: 1.0e-5
seed: 20260920
max_calls: 4
grad_clip: 1.0
